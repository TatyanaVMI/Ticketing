name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Ticketing.sln

      - name: Build
        run: dotnet build Ticketing.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Ticketing.sln --configuration Release --no-build